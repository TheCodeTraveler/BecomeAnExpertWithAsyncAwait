name: Build

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "*"

jobs:
  Build:
    strategy:
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    # Install .NET SDK
    - name: Setup .NET 10.0.x
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.x' # Adjust to your required .NET SDK version

    - name: Display .NET Info
      run: 'dotnet --info'

    # Formats and builds every solution in the workshop
    - name: Build All Solutions
      shell: pwsh
      run: ./BuildAllSolutions.ps1
